<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
	<title id="title">pi-md-preview</title>
	<!--
		pi-md-preview — primary mark.
		ink tile = the pi / browser frame the page opens in.
		paper page = the Markdown document, typeset.
		blue folded corner = the page being opened for preview.
		48px page padding on every side keeps the type block optically centred.
	-->
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2=".42" y2="1">
			<stop offset="0" stop-color="#1e2838"/>
			<stop offset=".55" stop-color="#121822"/>
			<stop offset="1" stop-color="#090c11"/>
		</linearGradient>
		<linearGradient id="paper" x1=".15" y1="0" x2=".7" y2="1">
			<stop offset="0" stop-color="#fffefa"/>
			<stop offset=".6" stop-color="#f9f5ec"/>
			<stop offset="1" stop-color="#efe9dc"/>
		</linearGradient>
		<linearGradient id="fold" x1=".1" y1="0" x2=".85" y2="1">
			<stop offset="0" stop-color="#aacdff"/>
			<stop offset=".5" stop-color="#5090f7"/>
			<stop offset="1" stop-color="#2a61d8"/>
		</linearGradient>
		<filter id="pageShadow" x="-25%" y="-25%" width="150%" height="155%">
			<feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
		</filter>
		<filter id="foldShadow" x="-45%" y="-45%" width="190%" height="190%">
			<feDropShadow dx="-2" dy="3" stdDeviation="5" flood-color="#0a2050" flood-opacity=".3"/>
		</filter>
	</defs>

	<rect width="512" height="512" rx="112" fill="url(#tile)"/>
	<rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#fff" stroke-opacity=".05"/>

	<g filter="url(#pageShadow)">
		<path d="M160 84H276L380 188v212a28 28 0 0 1-28 28H160a28 28 0 0 1-28-28V112a28 28 0 0 1 28-28Z" fill="url(#paper)"/>
	</g>
	<path d="M276 84 380 188H276Z" fill="url(#fold)" filter="url(#foldShadow)"/>
	<path d="M277.5 85.5 378.5 186.5" stroke="#0b2a6b" stroke-opacity=".16" stroke-width="3"/>

	<rect x="180" y="236" width="124" height="26" rx="13" fill="#0e1116"/>
	<g fill="#0e1116" fill-opacity=".42">
		<rect x="180" y="296" width="152" height="17" rx="8.5"/>
		<rect x="180" y="330" width="148" height="17" rx="8.5"/>
		<rect x="180" y="364" width="96" height="17" rx="8.5"/>
	</g>
</svg>
