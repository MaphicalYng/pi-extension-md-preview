		<path d="M277.5 85.5 378.5 186.5" stroke="#0b2a6b" stroke-opacity=".16" stroke-width="3"/>

		<rect x="180" y="236" width="124" height="26" rx="13" fill="#0e1116"/>
		<g fill="#0e1116" fill-opacity=".42">
